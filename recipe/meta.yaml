{% set name = "julearn" %}
{% set version = "0.3.6" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/julearn-{{ version }}.tar.gz
  sha256: 74123d3aa4394d6c720cda7f868e4b3f061e8041dc6afba584014f77dcb6f357

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61.0.0
    - wheel
    - setuptools-scm >=6.2
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.26.0,<3.0.0
    - pandas >=2.1.0,<4.0.0
    - scikit-learn >=1.5.0,<1.9.0
    - statsmodels >=0.13,<0.15
    - looseversion ==1.3.0
    - panel >=1.3.0
    - bokeh >=3.0.0
    - param >=2.0.0
    - scikit-optimize >=0.10.0,<0.11
    - optuna >=3.6.0,<3.7
    - optuna-integration >=3.6.0,<4.1

test:
  imports:
    - julearn
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/juaml/julearn
  summary: Juelich Machine Learning Library
  license: AGPL-3.0-only
  license_file: LICENSE.md
  doc_url: https://juaml.github.io/julearn/main/index.html
  dev_url: https://github.com/juaml/julearn

extra:
  recipe-maintainers:
    - synchon
